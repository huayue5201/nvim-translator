[package]
name = "translator"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "translator"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
md5 = "0.7"
regex = "1"
urlencoding = "2"

[profile.release]
opt-level = 2
strip = true
